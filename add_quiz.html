{% extends "base.html" %}

{% block content %}

<div class="form-box">

    <h2>Create New Quiz</h2>

    <form method="POST">

        <label>Quiz Title</label>

        <input
            type="text"
            name="title"
            placeholder="Example: Java Basics Quiz"
            required
        >

        <label>Subject</label>

        <input
            type="text"
            name="subject"
            placeholder="Example: Java"
            required
        >

        <button
            class="btn"
            type="submit"
        >
            Create Quiz
        </button>

    </form>

</div>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<div class="form-box">

    <h2>Create Account</h2>

    <form method="POST">

        <label>Name</label>

        <input
            type="text"
            name="name"
            required
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >

        <button class="btn" type="submit">
            Register
        </button>

    </form>

</div>

{% endblock %}
